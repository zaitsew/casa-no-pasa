# A fragment, not a stack. add-product.sh renders it to /srv/casanopasa/docker-compose.yml
# on the shared server and adds that path to the root /srv/docker-compose.yml's
# `include:` list, so the root file is never edited by hand.
#
# Two services share one image. Caddy (on the external network `apps`) reaches `casanopasa` by name and it
# publishes no host port. `casanopasa-mx` is the inbound SMTP receiver for alert emails: it publishes host
# port 25 (container port 2525) and hands each message to `casanopasa` over the `apps` network. DNS needs
# `MX in.casanopasa.fabriquefutur.com -> casanopasa.fabriquefutur.com (10)`. Host port 25 must be open in the
# server's firewall and not used by another mail daemon.
#
# add-product.sh renders this file only the first time. scripts/deploy.sh renders it again on every run
# (same sed substitutions) and uploads it to /srv/{{name}}/docker-compose.yml, so a change here reaches the
# server. Redeploy with scripts/deploy.sh. To do it by hand, use the ROOT stack, not this file on its own,
# so the containers stay in the one compose project:
#   cd /srv && docker compose up -d --build {{name}} {{name}}-mx

services:
  casanopasa:
    # Built on the box from the bundle rsynced to ./app (see deploy/droplet/Dockerfile).
    build:
      context: ./app
      dockerfile: Dockerfile
    image: casanopasa-web:latest
    restart: unless-stopped
    # add-product.sh creates /srv/{{name}}/.env from deploy/droplet/.env.example. Fill it in
    # (bot token, webhook secret, files key) before the first start.
    env_file:
      - /srv/{{name}}/.env
    environment:
      NODE_ENV: production
      PORT: "{{port}}"
      HOSTNAME: "0.0.0.0"
      # Where the SQLite file and the encrypted documents live inside the container: the volume below.
      CASANOPASA_DB_PATH: /data/casanopasa.db
      CASANOPASA_FILES_DIR: /data/files
    volumes:
      # The data volume: the database, its WAL files and the encrypted documents survive rebuilds. Owned by uid 1000
      # (the image's `node` user); scripts/deploy.sh fixes the owner on every run.
      - /srv/{{name}}/data:/data
    # Next stays well under its 192 MB heap cap; 300 MB leaves room for the runtime.
    mem_limit: 300m
    cpus: 0.5
    networks:
      - apps
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:{{port}}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Inbound alert email (src/mx/server.ts). Same image, a second entry point: mx-start.sh makes a
  # self-signed STARTTLS certificate on first start, then runs `node /app/mx.mjs`. It never sends mail.
  # Log lines hold counts and status codes only. No data volume: nothing is kept on this container.
  {{name}}-mx:
    image: casanopasa-web:latest
    restart: unless-stopped
    # Same .env as the web service: the shared CASANOPASA_INBOUND_SECRET (and CASANOPASA_INBOUND_DOMAIN, if set).
    env_file:
      - /srv/{{name}}/.env
    environment:
      NODE_ENV: production
      CASANOPASA_APP_URL: http://{{name}}:{{port}}
      MX_PORT: "2525"
      # The image's NODE_OPTIONS heap cap (192 MB) is for Next. Here: 64 MB heap in a 96 MB container; the receiver
      # works on at most 2 messages (2 MB each) at once and 10 connections, so its memory is bounded (src/mx/server.ts).
      NODE_OPTIONS: "--max-old-space-size=64"
    command: ["sh", "/app/mx-start.sh"]
    ports:
      - "25:2525"
    mem_limit: 96m
    cpus: 0.25
    networks:
      - apps
    depends_on:
      - {{name}}
    healthcheck:
      # A TCP connect to the SMTP port, from inside the container.
      test: ["CMD", "node", "-e", "require('net').connect(2525,'127.0.0.1').on('connect',function(){this.destroy();process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Declared external: this fragment joins the network Caddy is on instead of making one.
  apps:
    external: true
