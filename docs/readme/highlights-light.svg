<svg xmlns="http://www.w3.org/2000/svg" width="880" height="305" viewBox="0 0 880 305" role="img" aria-label="Highlights. INPUT: Share a link, text or screenshot. The Telegram bot reads any listing ad you send it. CHECK: Scam and contract flags. Red flags, seasonal-contract warnings and a fit score per flat. REPLY: A draft in your language. Spanish, Catalan or English. You send it, always. RENT: Barcelona rent-cap note. Links to the official rent index on each card. DOSSIER: Tenant file, encrypted. Documents sit behind a link that expires in 24 hours or 7 days. ALERTS: Alert emails become cards. Forwarded portal alerts turn into one card per flat.">
